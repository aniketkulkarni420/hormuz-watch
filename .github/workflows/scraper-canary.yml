name: scraper-canary
on:
  schedule:
    - cron: "0 12 * * 3"   # Wednesday 12:00 UTC - midweek, between Friday scrapes
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # scrape_bdti.py reads StockQ over plain HTTP (requests only); Playwright
      # is no longer used. (2026-11-06)
      - run: pip install --quiet requests
      - name: Run BDTI scraper (dry-run)
        id: dryrun
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/scrape_bdti.py --dry-run 2>&1 | tee /tmp/canary.log
      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-canary-${{ github.run_id }}
          path: /tmp/canary.log
          retention-days: 14
      # 2026-11-06: email only when both secrets exist; without them the step
      # logs a notice and skips. The job still fails when the scraper itself
      # failed, because that is what the canary is for.
      - name: Email alert (skipped without RESEND_KEY and ALERT_EMAIL)
        if: steps.dryrun.outcome != 'success'
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -z "$RESEND_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "::notice::RESEND_KEY or ALERT_EMAIL secret not set; email skipped"
            exit 0
          fi
          LOG_TAIL=$(tail -40 /tmp/canary.log | sed 's/"/\\"/g' | tr '\n' ' ')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Hormuz Watch <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"Hormuz Watch: BDTI scraper canary failed\",\"text\":\"BDTI scraper canary failed. The StockQ BDTI page structure may have changed. Manual BDTI entry at /admin/bdti may be needed.\\n\\nLog tail:\\n$LOG_TAIL\"}"
      - name: Fail when the scraper dry-run failed
        if: steps.dryrun.outcome != 'success'
        run: |
          echo "::error::BDTI scraper dry-run failed; see the canary log artifact"
          exit 1
